<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
<div id="floor"></div><div id="fx"></div>
<div class="wrap">
<header>
  <div class="cube"></div>
  <div><h1>Mod Tracker</h1><div class="tag">Select a title</div></div>
</header>
<nav class="views" role="tablist">
  <button data-v="tracker" class="on" role="tab">Tracker</button>
  <button data-v="news" role="tab">Newsletter<span class="dot" title="New issue"></span></button>
</nav>
<div id="view-tracker">
<div class="overview" id="overview"></div>

<div id="projects"></div>
</div>
<div id="view-news" hidden></div>
<footer>Summaries written from each project's commit history, tags, README and changelog (GitHub), its update log (GameBanana), its page (itch.io) or its Steam news. Last checked Nov 24, 2026. Version dates are release dates.</footer>
</div>

<script src="data/projects.js"></script>
<!-- Newsletters: one file per issue, oldest first -->
<script src="newsletters/issue-01.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
